name: OFR Data Ingest

on:
  # Run daily at 6am UTC (OFR updates at most once per day)
  schedule:
    - cron: '0 6 * * *'
  # Also allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        required: false
        default: ingest
        options:
          - ingest
          - export-csv
          - diagnose
      dataset:
        description: 'Dataset filter (fpf, tff, scoos, ficc) — leave blank for all'
        required: false
        default: ''
      metadata_only:
        description: 'Only backfill descriptions/categories — skip re-downloading data'
        type: boolean
        required: false
        default: false
      since:
        description: 'Date filter YYYY-MM-DD (ingest: fetch from, export: data from)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Diagnose ────────────────────────────────────────────────────────────
      - name: Diagnose API (dump raw responses)
        if: ${{ inputs.mode == 'diagnose' }}
        run: npm run diagnose

      # ── Ingest ──────────────────────────────────────────────────────────────
      - name: Run ingest
        if: ${{ inputs.mode == 'ingest' || github.event_name == 'schedule' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.dataset }}"            ] && ARGS="$ARGS --dataset ${{ inputs.dataset }}"
          [ -n "${{ inputs.since }}"              ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ "${{ inputs.metadata_only }}" = "true" ] && ARGS="$ARGS --metadata-only"
          npm run ingest -- $ARGS

      # ── Export CSV ──────────────────────────────────────────────────────────
      - name: Export CSV
        if: ${{ inputs.mode == 'export-csv' || inputs.mode == 'ingest' || github.event_name == 'schedule' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.dataset }}" ] && ARGS="$ARGS --dataset ${{ inputs.dataset }}"
          [ -n "${{ inputs.since }}"   ] && ARGS="$ARGS --since ${{ inputs.since }}"
          npm run export-csv -- $ARGS

      - name: Commit CSV files to repo
        if: ${{ inputs.mode == 'export-csv' || inputs.mode == 'ingest' || github.event_name == 'schedule' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Export CSV data [$(date -u +%Y-%m-%d)]"
          git push
